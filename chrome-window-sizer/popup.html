<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Window Sizer</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="apply.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Window Sizer</h1>
      <p>Choose the outer window size in pixels.</p>
    </header>
    <section class="presets-section" aria-labelledby="presets-heading">
      <h2 id="presets-heading">Saved sizes</h2>
      <div id="preset-list" class="preset-list"></div>
      <p id="empty-presets" class="empty-presets">No presets yet. Save a size below.</p>
    </section>
    <form id="window-form">
      <div class="dimensions">
        <label for="width">Width
          <input id="width" name="width" type="number" min="1" max="10000" step="1" inputmode="numeric" required>
        </label>
        <span class="times" aria-hidden="true">×</span>
        <label for="height">Height
          <input id="height" name="height" type="number" min="1" max="10000" step="1" inputmode="numeric" required>
        </label>
      </div>
      <button type="button" id="use-current-window" class="secondary capture-button">Use current window</button>
      <div class="actions">
        <button type="submit" id="open-window" class="primary">Open window</button>
        <button type="button" id="apply-window" class="secondary">Apply to current</button>
      </div>
      <div class="actions save-actions">
        <button type="button" id="save-preset" class="secondary">Save…</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <footer>Sizes include Chrome's frame and tabs. Chrome may adjust them to fit your display.</footer>
  </main>
  <dialog id="save-dialog" aria-labelledby="save-heading">
    <form id="save-form">
      <h2 id="save-heading">Save window size</h2>
      <p id="save-description" class="dialog-description"></p>
      <label for="preset-name" class="dialog-label">Preset name</label>
      <input id="preset-name" type="text" maxlength="48" placeholder="e.g., ChatGPT" autocomplete="off" required>
      <p id="save-error" class="dialog-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancel-save">Cancel</button>
        <button type="submit" class="primary" id="confirm-save">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-heading">
    <h2 id="delete-heading">Delete saved size?</h2>
    <p id="delete-description" class="dialog-description"></p>
    <p id="delete-error" class="dialog-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="cancel-delete">Cancel</button>
      <button type="button" class="danger" id="confirm-delete">Delete</button>
    </div>
  </dialog>
</body>
</html>
